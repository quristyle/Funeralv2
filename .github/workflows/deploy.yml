# 전체 배포 — main 에 올라가면 백엔드 10 · 프론트 2, 이미지 열둘을 GHCR 에
# 올리고 서버 러너가 pull·up 한다. 서버 쪽 구조는
# docs/analysis/39-jsini-deploy-setup-guide.md 참조.
#
# ── 왜 한 워크플로인가 ───────────────────────────────────────────
#
# 프론트를 따로 두면 두 워크플로가 같은 /srv/jsini/.env 의 TAG 를 각자
# 덮어쓴다. 둘이 겹치는 순간 한쪽은 자기가 만들지 않은 커밋의 이미지를
# 끌어오게 되고, 더 나쁜 것은 **그래도 배포가 성공한 것처럼 끝난다**는 점이다.
# 태그가 커밋 하나를 가리키려면 올리는 곳도 하나여야 한다.
#
# ── 왜 경로 필터를 잡별로 걸지 않나 ──────────────────────────────
#
# 배포는 열두 이미지를 **같은 TAG 로** 끌어온다. 바뀐 것만 빌드하면 나머지
# `funeralv2-*:<sha>` 가 GHCR 에 없어 `docker compose pull` 이 그 자리에서
# 죽는다. 안 바뀐 이미지는 레이어 캐시가 거의 그대로 통과하므로 다 만든다.
# 문서만 고친 커밋은 아래 워크플로 수준 필터가 통째로 걸러 낸다.
#
# 주의: deploy 잡은 push(main) 에서만 돈다 — fork PR 에 self-hosted 러너를
# 배정하지 않는다.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "ApiGateway/**"
      - "microservices/**"
      - "web/**"
      - "deploy/docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ── 백엔드 이미지 ──────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dir: ApiGateway,                     proj: ApiGateway }
          - { name: auth,    dir: microservices/AuthServer,        proj: AuthServer }
          # FileServer 만 ffmpeg 이 필요하다 (영상 썸네일 추출 · H.264 재인코딩).
          - { name: file,    dir: microservices/FileServer,        proj: FileServer, ffmpeg: 1 }
          - { name: site,    dir: microservices/SiteServer,        proj: SiteServer }
          - { name: notify,  dir: microservices/NotificationServer, proj: NotificationServer }
          - { name: life,    dir: microservices/LifeEnvServer,     proj: LifeEnvServer }
          - { name: funeral, dir: microservices/funeralv2Api,       proj: funeralv2Api }
          - { name: helpdesk, dir: microservices/HelpDeskServer,    proj: HelpDeskServer }
          - { name: projmng, dir: microservices/ProjMngServer,      proj: ProjMngServer }
          - { name: ai,      dir: microservices/AIAgentServer,      proj: AIAgentServer }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            PROJ_DIR=${{ matrix.dir }}
            PROJ_NAME=${{ matrix.proj }}
            WITH_FFMPEG=${{ matrix.ffmpeg || '0' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/funeralv2-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/funeralv2-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── 프론트 이미지 ──────────────────────────────────────────────
  #
  # 컨텍스트가 `web` 이다. 저장소 루트가 아닌 이유는 Dockerfile.web 머리말 참조.
  build-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 업무 포털 셸(:5557). 업무 모듈 여섯이 이 안에 함께 실린다.
          - { name: portal, dir: src/Shell/JSini.Web.Shell,  proj: JSini.Web.Shell }
          # 회사 소개 사이트(:5556). 포털과 무관한 별도 공개 사이트다.
          - { name: web,    dir: src/Site/JSini.PublicSite,  proj: JSini.PublicSite }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: deploy/docker/Dockerfile.web
          build-args: |
            PROJ_DIR=${{ matrix.dir }}
            PROJ_NAME=${{ matrix.proj }}
          # DevExpress 라이선스. **build-args 가 아니라 secrets 다** —
          # build-args 는 `docker history` 에 그대로 남는다.
          #
          # 없어도 빌드는 계속한다. 대신 Dockerfile 이 평가판 여부를 확인해
          # 로그에 크게 남긴다 — 여태 그 사실이 드러나는 곳이 파이프라인이
          # 아니라 **사용자 화면**뿐이었다. 왜 막지 않는지는 Dockerfile.web 참조.
          #
          # 값은 개발 장비의 $HOME/.config/DevExpress/DevExpress_License.txt
          # 내용 그대로다. 저장소 Settings → Secrets and variables → Actions.
          secrets: |
            dxlicense=${{ secrets.DEVEXPRESS_LICENSE }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/funeralv2-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/funeralv2-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── 배포 ───────────────────────────────────────────────────────
  deploy:
    needs: [build-backend, build-web]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: compose 갱신 후 태그 교체 배포
        run: |
          cp deploy/docker/docker-compose.prod.yml /srv/jsini/docker-compose.yml
          echo "TAG=${{ github.sha }}" > /srv/jsini/.env
          cd /srv/jsini
          docker compose pull -q
          docker compose up -d
          # 이름 잃은 레이어 + 저장소별 최근 3개를 넘는 옛 태그를 정리한다.
          # 사용 중 이미지는 docker rmi 가 거부하므로 || true 로 넘어간다.
          docker image prune -f > /dev/null
          for repo in $(docker images --format '{{.Repository}}' | grep 'funeralv2-' | sort -u); do
            docker images "$repo" --format '{{.Tag}}' | tail -n +4 | while read -r tag; do
              docker rmi "$repo:$tag" > /dev/null 2>&1 || true
            done
          done

      - name: 관통 검증 — 게이트웨이 (틀린 계정 → 401 이면 정상)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5265/api/auth/login \
            -H "Content-Type: application/json" -d '{"userId":"smoke","password":"x"}' --max-time 15)
          echo "login smoke: HTTP $code"
          test "$code" = "401"

      - name: 관통 검증 — 포털 셸
        # **200 만 보지 않는다.** 셸은 모듈 등록에 실패해도 뜨고 로그인 화면도
        # 내놓는다(web/CLAUDE.md 「셸 출력 폴더에 모듈 DLL 이 하나도 없었다」).
        # 그래서 로그인 폼의 입력 이름을 확인한다 — 그것이 있으면 화면이
        # 껍데기가 아니라 실제로 그려진 것이다.
        #
        # 셸은 백엔드보다 늦게 뜬다(모듈 여섯을 훑어 등록한다). 기다렸다 본다.
        run: |
          for i in $(seq 1 20); do
            body=$(curl -sS --max-time 15 http://127.0.0.1:5557/login || true)
            case "$body" in
              *'name="Input.Username"'*) echo "portal smoke: ok ($i)"; exit 0 ;;
            esac
            sleep 3
          done
          echo "포털 셸이 로그인 화면을 내놓지 않았다." >&2
          docker compose -f /srv/jsini/docker-compose.yml logs --tail 80 portal >&2 || true
          exit 1

      - name: 관통 검증 — 포털 PWA 자원
        # 매니페스트와 서비스워커가 없으면 **설치도 푸시도 조용히 죽는다.**
        # 화면은 멀쩡히 돌기 때문에 다른 검사로는 안 잡힌다 — 실제로 Vue 에서
        # .NET 으로 옮기는 동안 이 둘이 통째로 빠진 채 굴러갔다.
        run: |
          for path in /manifest.webmanifest /push-sw.js /pwa-icon-192.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://127.0.0.1:5557$path" || true)
            echo "pwa $path: HTTP $code"
            test "$code" = "200"
          done

      - name: 관통 검증 — 소개 사이트
        # `/` 는 언어를 골라 302 로 넘긴다(→ /ko). 리다이렉트를 따라가야 한다 —
        # 200 만 보면 정상 동작이 실패로 잡힌다.
        run: |
          for i in $(seq 1 15); do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 15 http://127.0.0.1:5556/ || true)
            [ "$code" = "200" ] && { echo "site smoke: HTTP 200 ($i)"; exit 0; }
            sleep 3
          done
          echo "소개 사이트가 200 을 내놓지 않았다 (마지막 $code)." >&2
          docker compose -f /srv/jsini/docker-compose.yml logs --tail 80 web >&2 || true
          exit 1
