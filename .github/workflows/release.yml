name: release

# 태그(v*)를 푸시하면 OS 별 설치 파일을 만들어 GitHub Release 에 첨부한다.
# 수동 실행(workflow_dispatch)도 가능하며, 이 경우 버전은 0.0.0-dev 로 붙는다.
#
# 만드는 것 (포털의 /system/player-download 화면이 이 이름으로 자산을 찾는다)
#
#   funeralv2_player-<ver>-windows-x64.zip              Windows 10/11 x64
#   funeralv2-player_<ver>_debian13_arm64.deb           라즈베리파이 (Pi OS Lite 64-bit)
#   funeralv2_player-<ver>-debian13-arm64.tar.gz
#   funeralv2-player_<ver>_ubuntu24_amd64.deb           Ubuntu 24.04 x64 (미니PC)
#   funeralv2_player-<ver>-ubuntu24-amd64.tar.gz
#   funeralv2-player_<ver>_ubuntu24_arm64.deb           Ubuntu 24.04 arm64 (Jetson 등)
#   funeralv2_player-<ver>-ubuntu24-arm64.tar.gz
#   funeralv2_player-<ver>-android-<서명>signed.apk     Android TV 박스 · 태블릿
#
#
# ── 왜 리눅스를 배포판마다 따로 빌드하나 ──────────────────────
#
# Flutter 리눅스 빌드는 **빌드한 곳의 glibc 를 그대로 요구한다.**
# Debian 13 trixie 는 glibc 2.41, Ubuntu 24.04 는 2.39 라서
# trixie 에서 빌드한 것은 Ubuntu 24.04 에서 실행되지 않는다(그 반대는 된다).
# 의존 패키지 이름도 갈린다. 그래서 대상 환경과 같은 곳에서 빌드한다.
# 파일 이름·Depends 는 packaging/build_deb.sh 가 /etc/os-release 를 보고 정한다.
#
#
# ── 넣지 않은 OS ─────────────────────────────────────────────
#
# macOS   러너(macos-latest)로 빌드는 되지만 서명·공증(notarization)이 없으면
#         Gatekeeper 가 막는다. 사이니지 기기로 쓰는 경우가 없어 넣지 않았다.
# iOS·Web 플레이어의 역할(HDMI 전체화면 · 자동 실행 · 로컬 캐시)과 맞지 않는다.
# 자세한 내용은 docs/analysis/23-player-release-targets.md 6절에 있다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # 개발 PC / 라즈베리파이 / CI 세 곳의 Flutter 버전은 항상 동일하게 유지한다.
  FLUTTER_VERSION: '3.44.4'
  APP_DIR: funeralv2_player

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 버전 결정
        id: ver
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v*) echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *)  echo "v=0.0.0-dev"            >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 빌드
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build windows --release `
            --build-name=${{ steps.ver.outputs.v }} `
            --build-number=${{ github.run_number }}

      - name: 압축
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path "${{ env.APP_DIR }}/build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/funeralv2_player-${{ steps.ver.outputs.v }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  # ------------------------------------------------- 라즈베리파이 (Debian 13)
  #
  # 배포 대상(Pi OS Lite = Debian 13 trixie)과 같은 환경에서 빌드해야
  # glibc·libmpv 버전이 맞는다. 그래서 컨테이너를 쓴다.
  #
  # Ubuntu 는 컨테이너 없이 러너에서 바로 빌드하므로 job 을 나눠 두었다.
  # 한 매트릭스에 섞으면 `container:` 를 조건부로 비워야 하는데,
  # 그 동작은 확실하지 않다 — 이미 돌고 있는 이 job 을 건드릴 이유가 없다.
  linux-debian13-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: 빌드 의존성 설치
        # 컨테이너에는 아무것도 없다. git 조차 없어서
        # actions/checkout 이 실패하므로 먼저 설치한다.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates unzip xz-utils zip file dpkg-dev \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-14-dev libmpv-dev libepoxy-dev

      - uses: actions/checkout@v4

      - name: Flutter SDK 설치
        # Flutter 는 linux-arm64 용 공식 아카이브를 배포하지 않으므로
        # subosito/flutter-action 을 쓸 수 없다(x64 SDK 를 받아와 실패한다).
        # 반드시 git clone 으로 설치한다.
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git /opt/flutter
          git config --global --add safe.directory /opt/flutter
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo /opt/flutter/bin >> "$GITHUB_PATH"

      - name: 버전 결정
        id: ver
        run: |
          case "$GITHUB_REF_NAME" in
            v*) echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *)  echo "v=0.0.0-dev"            >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 빌드
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release \
            --build-name=${{ steps.ver.outputs.v }} \
            --build-number=${{ github.run_number }}

      - name: 패키징 (.deb / .tar.gz)
        # 파일 이름과 Depends 는 스크립트가 /etc/os-release 를 보고 정한다 → debian13
        # Windows 에서 작성된 파일이라 실행 비트에 의존하지 않도록 bash 로 직접 호출한다.
        run: bash packaging/build_deb.sh "${{ steps.ver.outputs.v }}"

      - name: 만들어진 것 확인
        # 이름 규칙이 어긋나면 다운로드 화면이 자산을 못 찾는다.
        # 로그에 남겨 두면 릴리스 후에 확인하지 않아도 된다.
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: debian13-arm64
          path: dist/*

  # ------------------------------------------------------- Ubuntu (24.04 LTS)
  #
  # x64(미니PC)와 arm64(Jetson 등) 둘. 단계가 같고 러너만 다르므로 매트릭스로 돈다.
  # trixie 빌드는 glibc 가 높아 Ubuntu 24.04 에서 실행되지 않는다 — 그래서 따로 만든다.
  linux-ubuntu24:
    strategy:
      # 한쪽이 실패해도 다른 쪽 설치 파일은 나온다.
      fail-fast: false
      matrix:
        include:
          - name: ubuntu24-amd64
            runs-on: ubuntu-24.04
          - name: ubuntu24-arm64
            runs-on: ubuntu-24.04-arm

    name: linux (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: 빌드 의존성 설치
        # 러너에는 기본 도구가 이미 있다. Flutter 리눅스 빌드에 필요한 것만 더한다.
        # (noble 의 기본 GCC 는 13 이라 libstdc++-13-dev 다. trixie 는 14.)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config file dpkg-dev \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libmpv-dev libepoxy-dev

      - uses: actions/checkout@v4

      - name: Flutter SDK 설치
        # arm64 러너에서도 같은 방법을 쓴다 — 공식 아카이브가 x64 뿐이라
        # subosito/flutter-action 은 arm64 에서 실패한다. 두 경로를 나누지 않는다.
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git /opt/flutter
          git config --global --add safe.directory /opt/flutter
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo /opt/flutter/bin >> "$GITHUB_PATH"

      - name: 버전 결정
        id: ver
        run: |
          case "$GITHUB_REF_NAME" in
            v*) echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *)  echo "v=0.0.0-dev"            >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 빌드
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release \
            --build-name=${{ steps.ver.outputs.v }} \
            --build-number=${{ github.run_number }}

      - name: 패키징 (.deb / .tar.gz)
        # /etc/os-release 를 보고 ubuntu24 로 이름을 붙인다.
        run: bash packaging/build_deb.sh "${{ steps.ver.outputs.v }}"

      - name: 만들어진 것 확인
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  # ------------------------------------------------------------- Android TV
  #
  # TV 박스·태블릿용 APK. 하나로 모든 ABI(arm64·armv7·x86_64)를 담는다 —
  # 현장에서 파일 하나만 넣으면 되는 편이 낫다.
  #
  # ── 서명 ──────────────────────────────────────────────────
  #
  # 안드로이드는 서명 없는 APK 를 설치하지 않지만 **직접 만든 키가 없어도 된다.**
  # Flutter 기본 설정이 release 를 디버그 키로 서명하고, 그 APK 는 정상 설치된다.
  #
  # 문제는 디버그 키가 러너마다 새로 만들어진다는 점이다. 서명이 매번 달라지면
  # 이미 깔린 앱 위에 업데이트가 거부된다(INSTALL_FAILED_UPDATE_INCOMPATIBLE).
  # 그래서 secrets 에 keystore 를 넣어 두면 그것으로 서명한다(서명 고정 → 덮어쓰기 가능).
  #
  #   ANDROID_KEYSTORE_BASE64   .jks 를 base64 로 (base64 -w0 key.jks)
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  #   ANDROID_STORE_PASSWORD
  #
  # 넷을 넣지 않아도 job 은 성공한다 — 디버그 키로 서명된 APK 가 나온다.
  # 그때는 업데이트할 때 기존 앱을 지우고 다시 설치해야 한다.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter 안드로이드 빌드는 JDK 17 을 쓴다(build.gradle.kts 가 JVM_17 로 고정).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 버전 결정
        id: ver
        run: |
          case "$GITHUB_REF_NAME" in
            v*) echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *)  echo "v=0.0.0-dev"            >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 서명 키 준비 (secrets 에 있으면)
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "서명 키가 없다. 디버그 키로 서명한다 (설치는 되지만 덮어쓰기 업데이트는 안 된다)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE" | base64 -d > "$APP_DIR/android/release.jks"
          cat > "$APP_DIR/android/key.properties" <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "signed=release" >> "$GITHUB_OUTPUT"

      - name: 빌드
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.v }} \
            --build-number=${{ github.run_number }}

      - name: 이름 붙이기
        # 서명 방식을 파일 이름에 남긴다. 받는 사람이 덮어쓰기 업데이트가 되는지
        # 파일 이름만 보고 알 수 있어야 한다.
        run: |
          mkdir -p dist
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" \
            "dist/funeralv2_player-${{ steps.ver.outputs.v }}-android-${{ steps.sign.outputs.signed }}signed.apk"
          ls -lh dist/

      - name: 서명 키 지우기
        # 러너는 실행마다 버려지지만, 뒤 단계에 남겨 둘 이유가 없다.
        if: always()
        run: rm -f "$APP_DIR/android/release.jks" "$APP_DIR/android/key.properties"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  # ---------------------------------------------------------------- Release
  release:
    needs: [windows, linux-debian13-arm64, linux-ubuntu24, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 체크섬 생성
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 설치

            어느 파일을 받아야 하는지는 관리 포털의
            **시스템 → 플레이어 다운로드** 화면이 OS 별로 골라 준다.

            > 리눅스 파일은 **빌드한 배포판 이상**에서만 동작한다.
            > `debian13` 파일은 Ubuntu 24.04 에서 실행되지 않는다 — `ubuntu24` 파일을 쓸 것.

            ---

            **라즈베리파이 (Raspberry Pi OS Lite 64-bit, Debian 13 trixie)**

            ```
            sudo apt install ./funeralv2-player_<버전>_debian13_arm64.deb
            sudo reboot
            ```

            **Ubuntu 24.04 x64 (미니PC)**

            ```
            sudo apt install ./funeralv2-player_<버전>_ubuntu24_amd64.deb
            sudo reboot
            ```

            **Ubuntu 24.04 arm64 (Jetson 등)**

            ```
            sudo apt install ./funeralv2-player_<버전>_ubuntu24_arm64.deb
            sudo reboot
            ```

            의존 패키지(libmpv2, libgtk-3-0t64, cage 등)는 apt 가 함께 설치한다.
            재부팅하면 HDMI 화면에 전체화면으로 자동 실행된다.
            해상도 등은 `/etc/default/funeralv2-player` 에서 조정한다.

            데스크톱 배포판(Ubuntu Desktop 등)에 넣는 경우에는 디스플레이 매니저를
            끄고 콘솔 부팅으로 바꿔야 한다 — 플레이어가 tty1 을 가져간다.

            ```
            sudo systemctl disable --now gdm3
            sudo systemctl set-default multi-user.target
            ```

            **Windows 10/11 x64**

            zip 을 풀고 `funeralv2_player.exe` 를 실행한다.
            Microsoft Visual C++ 2015-2022 재배포 패키지가 필요하다.

            **Android TV 박스 · 태블릿**

            `설정 → 보안` 에서 알 수 없는 출처 설치를 허용한 뒤 APK 를 넣는다.

            ```
            adb install -r funeralv2_player-<버전>-android-<서명>signed.apk
            ```

            TV 박스는 파일 관리자가 없는 경우가 많다 — `adb` 또는 USB,
            Downloader 같은 사이드로드 앱을 쓴다. 설치하면 TV 홈 화면 앱 목록에 나타난다.

            > 파일 이름의 `debugsigned` 는 저장소에 서명 키를 넣지 않아 **빌드마다 서명이
            > 달라지는** 상태다. 이 경우 기존 앱 위에 덮어쓰기 업데이트가 되지 않으니
            > 지운 뒤 다시 설치한다. `releasesigned` 는 서명이 고정되어 덮어쓰기가 된다.
