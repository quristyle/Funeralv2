# 빌드 검사 — PR 과 main 푸시에서 돈다. **배포하지 않는다.**
#
# deploy 워크플로는 컨테이너 안에서 `dotnet publish` 만 한다. 그래서 거기서는
# 아키텍처 테스트(web/tests, 65건)가 한 번도 돌지 않는다 — 그 테스트가 막는
# 것들(모듈이 셸 출력에 실려 있나 · RouteKey 가 유일한가 · HttpClient 이름이
# 겹치지 않나)은 하나같이 **빌드는 통과하고 런타임에 조용히 틀리는** 종류다.
# 그걸 배포 뒤에 알게 되지 않으려고 여기서 먼저 돌린다.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 연달아 밀어 넣으면 앞엣것은 버린다. 배포와 달리 결과를
  # 남길 이유가 없다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDK 버전은 global.json 이 정한다. 여기에 version 을 또 적으면
      # 두 곳이 어긋날 수 있다.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 복원
        run: dotnet restore jsini.sln

      - name: 빌드
        run: dotnet build jsini.sln -c Release --no-restore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # web/ 은 자기 nuget.config · Directory.Packages.props 를 쓴다.
      # 반드시 그 디렉터리에서 돌려야 한다 — 루트에서 경로만 넘기면
      # 루트 설정이 걸린다.
      - name: 복원
        working-directory: web
        run: dotnet restore JSini.Web.slnx

      - name: 빌드
        working-directory: web
        # DevExpress 라이선스가 러너에 없다. DX1000/DX1001 은
        # Directory.Build.props 가 경고로 남겨 두었으므로 빌드는 통과한다.
        run: dotnet build JSini.Web.slnx -c Release --no-restore

      - name: 아키텍처 테스트
        working-directory: web
        run: dotnet test JSini.Web.slnx -c Release --no-build --verbosity normal
