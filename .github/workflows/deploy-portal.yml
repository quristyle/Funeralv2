# 업무 포털(portal.jsini.co.kr) 배포 — vben SPA 빌드를 /srv/jsini/portal 로.
# 공유 패키지(fronts/packages·internal)가 바뀌어도 다시 배포한다.
name: deploy-portal

on:
  push:
    branches: [main]
    paths:
      - "fronts/apps/jsini-portal/**"
      - "fronts/packages/**"
      - "fronts/internal/**"
      - "fronts/pnpm-lock.yaml"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-portal
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronts
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fronts/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fronts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @vben/jsini-portal build

      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: fronts/apps/jsini-portal/dist
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: portal-dist

      - name: 정적 루트 교체
        run: |
          rsync -a --delete portal-dist/ /srv/jsini/portal/
          code=$(curl -sk -o /dev/null -w "%{http_code}" --resolve portal.jsini.co.kr:443:127.0.0.1 https://portal.jsini.co.kr/ --max-time 10)
          echo "portal: HTTP $code"
          test "$code" = "200"
