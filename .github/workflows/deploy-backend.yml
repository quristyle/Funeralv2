# 백엔드 배포 — main push 시 이미지 6종을 GHCR 에 올리고 서버 러너가 pull·up 한다.
# 서버 쪽 구조는 docs/analysis/39-jsini-deploy-setup-guide.md 참조.
# 주의: deploy 잡은 push(main) 에서만 돈다 — fork PR 에 self-hosted 러너를 배정하지 않는다.
name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "ApiGateway/**"
      - "microservices/**"
      - "deploy/docker/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dir: ApiGateway,                     proj: ApiGateway }
          - { name: auth,    dir: microservices/AuthServer,        proj: AuthServer }
          - { name: file,    dir: microservices/FileServer,        proj: FileServer }
          - { name: site,    dir: microservices/SiteServer,        proj: SiteServer }
          - { name: notify,  dir: microservices/NotificationServer, proj: NotificationServer }
          - { name: life,    dir: microservices/LifeEnvServer,     proj: LifeEnvServer }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            PROJ_DIR=${{ matrix.dir }}
            PROJ_NAME=${{ matrix.proj }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/funeralv2-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/funeralv2-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: compose 갱신 후 태그 교체 배포
        run: |
          cp deploy/docker/docker-compose.prod.yml /srv/jsini/docker-compose.yml
          echo "TAG=${{ github.sha }}" > /srv/jsini/.env
          cd /srv/jsini
          docker compose pull -q
          docker compose up -d
          docker image prune -f > /dev/null

      - name: 관통 검증 (틀린 계정 → 401 이면 정상)
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5265/api/auth/login \
            -H "Content-Type: application/json" -d '{"userId":"smoke","password":"x"}' --max-time 15)
          echo "login smoke: HTTP $code"
          test "$code" = "401"
