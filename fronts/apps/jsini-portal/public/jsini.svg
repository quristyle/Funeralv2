<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Blue Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#5A2D82"/>

  <!-- Main Text: INI -->
  <text
    x="50%"
    y="60%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="240"
    font-weight="900"
    fill="white"
    letter-spacing="10"
    filter="url(#glow)"
  >
    INI
  </text>

  <!-- Sub Text: JS -->
  <text
    x="78%"
    y="39%"
    text-anchor="start"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="52"
    font-style="italic"
    font-weight="700"
    fill="#007BFF"
    filter="url(#glow)"
  >
    JS
  </text>
</svg>