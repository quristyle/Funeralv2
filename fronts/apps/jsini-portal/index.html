<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="Funeral Management System" />
    <meta name="keywords" content="quristyle" />
    <meta name="author" content="quristyle" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <title>%VITE_APP_TITLE%</title>

    <!--
      파비콘 — 브랜드 키트의 것을 쓴다 (`docs/brand/favicon.svg`).
      우상단을 45° 깎은 잉크 블록에 블레이드 J 를 음각한 모양이다.

      SVG 를 먼저 선언한다. 요즘 브라우저는 이것을 고르고, SVG 를 못 읽는 옛 브라우저만
      `/favicon.ico` 로 내려간다. 그 .ico 도 같은 좌표에서 만든 브랜드 것이다
      (16·32·48·64·128·256px). `docs/brand/generate.py` 가 함께 만든다.
    -->
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />

    <!--
      PWA — 매니페스트 링크는 vite-plugin-pwa 가 빌드 때 넣어 준다.
      여기서는 iOS 홈 화면 아이콘과 브라우저 UI 색만 선언한다.
      아이콘 PNG 는 docs/brand/generate.py 가 만든다.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="JSini 포털" />


    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BGNLDKDSES"></script>
<script>
      if (window._VBEN_ADMIN_PRO_APP_CONF_) {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-BGNLDKDSES');
      }
</script>



  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
