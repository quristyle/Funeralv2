<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>JSINI 로더</title>
  <desc>상승 조각이 차례로 솟는 대기 표시. 색은 currentColor 를 따른다</desc>
  <style>
    .jsini-loader-bar { transform-origin: center bottom; animation: jsini-loader 1.1s ease-in-out infinite; }
    .jsini-loader-bar:nth-child(1) { animation-delay: 0s; }
    .jsini-loader-bar:nth-child(2) { animation-delay: 0.12s; }
    .jsini-loader-bar:nth-child(3) { animation-delay: 0.24s; }
    .jsini-loader-bar:nth-child(4) { animation-delay: 0.36s; }
    @keyframes jsini-loader {
      0%, 100% { transform: scaleY(0.55); }
      50%      { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .jsini-loader-bar { animation: none; }
    }
  </style>
  <g transform="translate(4.84,0) skewX(-12.4)">
    <rect class="jsini-loader-bar" x="5" y="28" width="6" height="16" fill="currentColor" opacity="0.3"/>
    <rect class="jsini-loader-bar" x="16" y="22" width="6" height="22" fill="currentColor" opacity="0.5"/>
    <rect class="jsini-loader-bar" x="27" y="16" width="6" height="28" fill="currentColor" opacity="0.75"/>
    <rect class="jsini-loader-bar" x="38" y="10" width="6" height="34" fill="currentColor" opacity="1"/>
  </g>
</svg>
