# 받아쓰기(STT) 서버 — 추론 장비(호스트명 `llm`)에 올린다.
#
# OpenAI 의 `/v1/audio/transcriptions` 와 같은 모양으로 열린다.
# AIAgentServer 의 SpeechClient 가 그 규격으로 부른다.
#
# **CPU 로 돈다.** 같은 장비의 GPU 는 추론(Qwen3-Next-80B)이 거의 다 쓰고
# 있어서, 임베딩 서버(BGE-M3)와 같은 까닭으로 여기도 CPU 를 쓴다.
# GPU 로 옮기는 길은 README.md 의 「GPU 로 올리기」에 있다.

services:
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: jsini-stt
    restart: unless-stopped

    # **바깥에 열지 않는다.** nginx 가 Bearer 로 가른 뒤에만 들어온다 —
    # 추론·임베딩과 같은 길이다. 0.0.0.0 으로 열면 장비가 인터넷에
    # 노출됐던 그 일이 되풀이된다.
    ports:
      - "127.0.0.1:11437:8000"

    environment:
      # 미리 올려 둘 모델. 첫 요청에서 내려받으면 그 한 번이 몇 분 걸리고,
      # 그동안 화면은 「받아쓰기 서버가 제때 답하지 않았습니다」만 띄운다.
      - WHISPER__MODEL=Systran/faster-whisper-small

      # CPU 에서는 int8 이 아니면 쓸 만한 속도가 안 나온다.
      - WHISPER__COMPUTE_TYPE=int8

      # **안 쓰면 내린다.** 모델 하나가 1GB 안팎을 물고 있는데, 받아쓰기는
      # 하루 종일 쓰는 것이 아니라 가끔 쓰는 기능이다.
      - WHISPER__TTL=600

      # 받아쓰기만 쓴다. 이 이미지는 읽어주기(TTS)도 들고 있지만 그쪽은
      # 브라우저가 한다(JSini.Web.Components 의 speech.js).
      - ENABLE_UI=false

    volumes:
      # 모델 가중치. 이것이 없으면 컨테이너를 다시 띄울 때마다 또 내려받는다.
      - stt-models:/home/ubuntu/.cache/huggingface

    # 무음 하나를 받아쓰는 데 30초를 넘기면 뭔가 잘못된 것이다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  stt-models:
