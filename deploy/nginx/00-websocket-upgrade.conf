# 웹소켓 업그레이드용 map. /etc/nginx/conf.d/ 에 둔다 (http 블록 안에 들어간다).
#
# **nginx 는 $connection_upgrade 를 스스로 만들지 않는다.** 정의하지 않고 쓰면
# 기동이 "unknown variable" 로 실패한다. 그런데 그냥 `Connection: upgrade` 로
# 박아 두어도 안 된다 — Blazor 회로는 웹소켓이 막힌 망에서 **롱폴링으로
# 내려앉는데**, 그 요청에는 Upgrade 헤더가 없어서 박아 둔 값이 거짓말이 된다.
#
# map 은 들어온 요청에 Upgrade 가 있을 때만 upgrade 를 내보내고, 없으면
# close 를 내보낸다. 그래서 두 갈래가 모두 산다.
#
# 파일 이름이 00- 으로 시작하는 것은 conf.d 를 알파벳 순으로 읽기 때문이다 —
# 쓰는 쪽(sites-enabled)보다 먼저 정의돼야 한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
