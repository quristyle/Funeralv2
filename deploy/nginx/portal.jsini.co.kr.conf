# portal.jsini.co.kr — 업무 포털 (.NET 10 Blazor 셸, 컨테이너 127.0.0.1:5557)
#
# 정본은 이 파일이다. 서버의 /etc/nginx/sites-available/ 로 복사해서 쓴다
# (deploy/nginx/README.md 참조).
#
# ── 2026-09-13 에 바뀐 것 ────────────────────────────────────────
#
# 그 전에는 nginx 가 /srv/jsini/portal 의 **정적 파일(vben 이 만든 SPA)** 을
# 직접 서빙했다. 프론트를 .NET 으로 옮기면서 서버 렌더 + SignalR 회로가 되어
# 정적 서빙으로는 아예 동작하지 않는다. 그래서 리버스 프록시로 바꾼다.
#
# 되돌리려면 git 이력에서 이 파일 이전 판을 꺼내면 된다. /srv/jsini/portal 은
# 당분간 지우지 않는다 — 되돌릴 자리가 있어야 한다.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.jsini.co.kr admin.jsini.co.kr;

    # 첨부 업로드가 이 길로 온다. 셸이 받아 게이트웨이로 중계한다.
    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/portal.jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.jsini.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── 뒷단이 죽었을 때의 화면 ────────────────────────────────
    #
    # 기본값은 nginx 가 들고 있는 흰 바탕에 「502 Bad Gateway」 한 줄이다.
    # 사람이 보는 자리라 브랜드 화면으로 바꾼다 — 정본은
    # `deploy/nginx/html/50x.html`, 서버에서는 아래 root 아래에 둔다.
    #
    # **셋을 함께 받는다.** 원인이 한 뭉치이기 때문이다 — 502 는 컨테이너가
    # 죽었거나 아직 안 떴을 때, 503 은 받아 줄 자리가 없을 때, 504 는 떠
    # 있지만 제때 대답하지 못할 때다. 보는 사람에게는 모두 "안 열린다" 하나다.
    # 숫자는 화면 안에서 SSI 가 갈아 끼운다.
    #
    # **뒷단이 스스로 낸 오류는 여기에 안 걸린다.** `proxy_intercept_errors` 가
    # 꺼져 있어서(기본값) 이 자리는 nginx 가 직접 만든 오류 — 붙지 못했거나
    # 제때 대답을 못 받은 것 — 만 받는다. 앱이 보낸 500·503 은 그대로 지나가고,
    # 그쪽은 포털의 `/error` 화면이 받는다(docs/error-trace.md).
    error_page 502 503 504 /50x.html;

    location = /50x.html {
        # 주소로 직접 열 수 없다. error_page 로만 닿는다(직접 부르면 404).
        internal;
        root /srv/jsini/nginx-errors;

        # 화면의 `<!--# echo var="status" -->` 를 실제 코드로 바꾼다.
        # **이 한 줄이 없으면 그 자리가 빈 채로 나간다** — 502 인지 504 인지
        # 적어 보낼 값이 사라지고, 화면은 멀쩡해 보인다.
        ssi on;

        # 뒷단이 돌아온 뒤에도 브라우저가 이 화면을 들고 있으면 안 된다.
        add_header Cache-Control "no-store" always;
    }

    # 사람이 아니라 프로그램이 보는 길은 JSON 으로 돌려준다(아래 /api/ 에서
    # 이 자리를 가리킨다). `error_page` 에 `=` 를 붙이지 않았으므로 나가는
    # 코드는 처음 난 것(502 · 503 · 504)이 그대로 유지되고, 본문만 바뀐다.
    # 봉투 모양은 `ApiResponse` 와 같다.
    location @api_down {
        default_type application/json;
        return 502 '{"success":false,"code":"E$status","message":"서버에 연결할 수 없습니다. 잠시 뒤 다시 시도해 주세요.","data":null}';
    }

    # ── Blazor 회로 (SignalR 웹소켓) ────────────────────────────
    #
    # **이 블록이 없으면 화면은 그려지는데 단추가 하나도 안 눌린다.**
    # 프리렌더된 HTML 은 그냥 오므로 겉보기에 멀쩡하고, 브라우저 콘솔을
    # 봐야 웹소켓 협상이 실패한 것이 보인다. 같은 증상이 web/CLAUDE.md
    # "대화형이 안 되는 함정" 에 적혀 있다 — 원인만 다르고 증상이 같다.
    #
    # 회로는 사람이 화면을 열어 둔 내내 붙어 있다. 기본 read timeout 60초로는
    # 가만히 둔 탭이 1분마다 끊겨 "연결이 끊겼습니다" 막대가 뜬다.
    location /_blazor {
        proxy_pass http://127.0.0.1:5557;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    # ── 게이트웨이 직행 ────────────────────────────────────────
    #
    # 셸은 /api 를 서빙하지 않는다(BFF 라 서버끼리 부른다). 그래도 이 길을
    # 남겨 두는 이유는 **옛 주소를 들고 있는 것들** 때문이다 — 플레이어,
    # 공지 본문에 박힌 /api/file/download/..., 북마크.
    #
    # 셸보다 **먼저** 매칭돼야 한다. location 우선순위가 접두사 길이 순이라
    # /api/ 가 / 보다 길어 그대로 이긴다.
    location /api/ {
        proxy_pass http://127.0.0.1:5265/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        # 이 길로 오는 것은 사람이 아니라 프로그램이다(플레이어 · 북마크 ·
        # 공지 본문에 박힌 내려받기 주소). 게이트웨이가 죽었을 때 HTML 안내
        # 화면을 돌려주면 JSON 을 기다리던 쪽이 파싱 오류로 죽어, 진짜
        # 원인이 엉뚱한 오류 뒤로 숨는다.
        error_page 502 503 504 @api_down;
    }

    # ── 서비스워커 ─────────────────────────────────────────────
    #
    # **캐시하면 안 된다.** 서비스워커가 캐시에 잡히면 새로 배포한 판을
    # 브라우저가 며칠씩 못 본다. 그러면 푸시 페이로드 모양을 바꿨을 때
    # 알림이 빈 채로 뜨는 식으로, 서버만 고쳐서는 안 고쳐지는 상태가 된다.
    #
    # 범위(scope)가 "/" 여야 모든 화면을 관장한다. 파일이 루트에 있으므로
    # 별도 Service-Worker-Allowed 헤더는 필요 없다.
    location = /push-sw.js {
        proxy_pass http://127.0.0.1:5557;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── 나머지 전부 ────────────────────────────────────────────
    #
    # 정적 자원(_framework · _content · MapStaticAssets 가 만든 지문 주소)도
    # 셸이 서빙한다. nginx 가 따로 잡지 않는 이유는 그것들이 **빌드 산출물
    # 매니페스트**로 관리되기 때문이다 — 경로를 nginx 에 손으로 적어 두면
    # 지문이 바뀔 때마다 어긋난다.
    location / {
        proxy_pass http://127.0.0.1:5557;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 응답 압축은 셸이 한다(JSiniWebApp 의 ResponseCompression).
        # 버퍼링을 켜 두면 이미 압축된 본문을 nginx 가 다시 모았다 보내며
        # 첫 바이트가 늦어진다.
        proxy_buffering off;

        # 큰 화면(프리렌더된 DevExpress 그리드)의 응답 헤더가 기본 버퍼를
        # 넘는 일이 있다. 넘으면 502 다.
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 8 16k;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.jsini.co.kr admin.jsini.co.kr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
