# jsini.co.kr — 회사 소개 사이트 (.NET 10 Blazor 정적 SSR, 컨테이너 127.0.0.1:5556)
#
# 정본은 이 파일이다. 서버의 /etc/nginx/sites-available/ 로 복사해서 쓴다.
#
# ── 2026-09-13 에 바뀐 것 ────────────────────────────────────────
#
# 그 전에는 nginx 가 /srv/jsini/site 의 vite-ssg 산출물을 직접 서빙했다
# (`try_files $uri $uri/ $uri.html /index.html`). 지금은 서버가 매 요청을
# 렌더한다 — 원본이 프리렌더를 고른 이유(첫 화면 속도·검색 노출)는 정적 SSR
# 로 그대로 잇는다.
#
# **이 사이트에는 Blazor 회로가 없다.** 대화형 부품이 하나도 없어서
# blazor.web.js 를 싣지 않는다. 그래서 포털과 달리 /_blazor 블록이 없다 —
# 없는 것이 맞고, 넣어 두면 나중에 읽는 사람이 회로가 있는 줄로 안다.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jsini.co.kr;

    # 문의 폼에 파일이 붙는다.
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsini.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 표지 이미지와 자료 내려받기가 이 길로 온다. 사이트가 마크업에
    # https://jsini.co.kr/api/... 로 박아 내보낸다
    # (compose 의 Gateway__PublicBaseUrl). 게이트웨이가 직접 서빙한다.
    location /api/ {
        proxy_pass http://127.0.0.1:5265/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5556;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 8 16k;
    }
}

# www 는 본 도메인으로 통일
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jsini.co.kr;
    ssl_certificate /etc/letsencrypt/live/jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsini.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://jsini.co.kr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jsini.co.kr www.jsini.co.kr;
    # 인증서 webroot 갱신 경로는 리다이렉트에서 제외한다
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://jsini.co.kr$request_uri; }
}
