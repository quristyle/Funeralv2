# jsini.co.kr — 회사 소개 사이트 (.NET 10 Blazor 정적 SSR, 컨테이너 127.0.0.1:5556)
#
# 정본은 이 파일이다. 서버의 /etc/nginx/sites-available/ 로 복사해서 쓴다.
#
# ── 2026-09-13 에 바뀐 것 ────────────────────────────────────────
#
# 그 전에는 nginx 가 /srv/jsini/site 의 vite-ssg 산출물을 직접 서빙했다
# (`try_files $uri $uri/ $uri.html /index.html`). 지금은 서버가 매 요청을
# 렌더한다 — 원본이 프리렌더를 고른 이유(첫 화면 속도·검색 노출)는 정적 SSR
# 로 그대로 잇는다.
#
# **이 사이트에는 Blazor 회로가 없다.** 대화형 부품이 하나도 없어서
# blazor.web.js 를 싣지 않는다. 그래서 포털과 달리 /_blazor 블록이 없다 —
# 없는 것이 맞고, 넣어 두면 나중에 읽는 사람이 회로가 있는 줄로 안다.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jsini.co.kr;

    # 문의 폼에 파일이 붙는다.
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsini.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── 뒷단이 죽었을 때의 화면 ────────────────────────────────
    #
    # 기본값은 nginx 가 들고 있는 흰 바탕에 「502 Bad Gateway」 한 줄이다.
    # 사람이 보는 자리라 브랜드 화면으로 바꾼다 — 정본은
    # `deploy/nginx/html/50x.html`, 서버에서는 아래 root 아래에 둔다.
    #
    # **셋을 함께 받는다.** 원인이 한 뭉치이기 때문이다 — 502 는 컨테이너가
    # 죽었거나 아직 안 떴을 때, 503 은 받아 줄 자리가 없을 때, 504 는 떠
    # 있지만 제때 대답하지 못할 때다. 보는 사람에게는 모두 "안 열린다" 하나다.
    # 숫자는 화면 안에서 SSI 가 갈아 끼운다.
    #
    # **뒷단이 스스로 낸 오류는 여기에 안 걸린다.** `proxy_intercept_errors` 가
    # 꺼져 있어서(기본값) 이 자리는 nginx 가 직접 만든 오류 — 붙지 못했거나
    # 제때 대답을 못 받은 것 — 만 받는다. 앱이 보낸 500·503 은 그대로 지나가고,
    # 그쪽은 포털의 `/error` 화면이 받는다(docs/error-trace.md).
    error_page 502 503 504 /50x.html;

    location = /50x.html {
        # 주소로 직접 열 수 없다. error_page 로만 닿는다(직접 부르면 404).
        internal;
        root /srv/jsini/nginx-errors;

        # 화면의 `<!--# echo var="status" -->` 를 실제 코드로 바꾼다.
        # **이 한 줄이 없으면 그 자리가 빈 채로 나간다** — 502 인지 504 인지
        # 적어 보낼 값이 사라지고, 화면은 멀쩡해 보인다.
        ssi on;

        # 뒷단이 돌아온 뒤에도 브라우저가 이 화면을 들고 있으면 안 된다.
        add_header Cache-Control "no-store" always;
    }

    # 사람이 아니라 프로그램이 보는 길은 JSON 으로 돌려준다(아래 /api/ 에서
    # 이 자리를 가리킨다). `error_page` 에 `=` 를 붙이지 않았으므로 나가는
    # 코드는 처음 난 것(502 · 503 · 504)이 그대로 유지되고, 본문만 바뀐다.
    # 봉투 모양은 `ApiResponse` 와 같다.
    location @api_down {
        default_type application/json;
        return 502 '{"success":false,"code":"E$status","message":"서버에 연결할 수 없습니다. 잠시 뒤 다시 시도해 주세요.","data":null}';
    }

    # 표지 이미지와 자료 내려받기가 이 길로 온다. 사이트가 마크업에
    # https://jsini.co.kr/api/... 로 박아 내보낸다
    # (compose 의 Gateway__PublicBaseUrl). 게이트웨이가 직접 서빙한다.
    location /api/ {
        proxy_pass http://127.0.0.1:5265/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        # 이 길로 오는 것은 사람이 아니라 프로그램이다(플레이어 · 북마크 ·
        # 공지 본문에 박힌 내려받기 주소). 게이트웨이가 죽었을 때 HTML 안내
        # 화면을 돌려주면 JSON 을 기다리던 쪽이 파싱 오류로 죽어, 진짜
        # 원인이 엉뚱한 오류 뒤로 숨는다.
        error_page 502 503 504 @api_down;
    }

    location / {
        proxy_pass http://127.0.0.1:5556;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 24k;
        proxy_buffers 8 16k;
    }
}

# www 는 본 도메인으로 통일
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jsini.co.kr;
    ssl_certificate /etc/letsencrypt/live/jsini.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsini.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://jsini.co.kr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jsini.co.kr www.jsini.co.kr;
    # 인증서 webroot 갱신 경로는 리다이렉트에서 제외한다
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://jsini.co.kr$request_uri; }
}
