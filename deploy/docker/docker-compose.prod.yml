# 운영 compose — 서버의 /srv/jsini/docker-compose.yml 로 복사되어 돈다.
# 이미지 태그는 .env 의 TAG 로 정한다 (배포 = TAG 바꿔서 up, 롤백 = 이전 TAG 로 up).
# 비밀값은 /srv/jsini/config/<서비스>/appsettings.Local.json 마운트로만 들어간다.
# 호스트 루프백에 공개하는 것은 셋뿐이다 — nginx 가 여기로 프록시한다.
#   127.0.0.1:5265  게이트웨이 (portal.jsini.co.kr/api/ · jsini.co.kr/api/)
#   127.0.0.1:5557  업무 포털 셸  (portal.jsini.co.kr)
#   127.0.0.1:5556  회사 소개 사이트 (jsini.co.kr)
#
# 프론트 둘은 컨테이너 안에서 게이트웨이를 **서비스 이름으로** 부른다
# (http://gateway:8080/api/). 호스트 루프백을 거치지 않으므로 nginx 가 죽어도
# 포털↔게이트웨이 통신은 끊기지 않는다.

x-common: &common
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &common-env
    ASPNETCORE_ENVIRONMENT: Production
    TZ: Asia/Seoul
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-gateway:${TAG:-latest}
    ports:
      - "127.0.0.1:5265:8080"
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/ApiGateway/appsettings.Local.json:/app/appsettings.Local.json:ro
    depends_on: [auth, file, site, notify, life, funeral, helpdesk, projmng, ai]

  auth:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-auth:${TAG:-latest}
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/AuthServer/appsettings.Local.json:/app/appsettings.Local.json:ro
      # 배포 현황 화면이 컨테이너 상태를 읽는다 (읽기 전용)
      - /var/run/docker.sock:/var/run/docker.sock:ro

  file:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-file:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/FileServer/appsettings.Local.json:/app/appsettings.Local.json:ro
      - /srv/jsini/files:/data/files

  site:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-site:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/SiteServer/appsettings.Local.json:/app/appsettings.Local.json:ro

  notify:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-notify:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/NotificationServer/appsettings.Local.json:/app/appsettings.Local.json:ro

  life:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-life:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/LifeEnvServer/appsettings.Local.json:/app/appsettings.Local.json:ro

  funeral:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-funeral:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/funeralv2Api/appsettings.Local.json:/app/appsettings.Local.json:ro

  helpdesk:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-helpdesk:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/HelpDeskServer/appsettings.Local.json:/app/appsettings.Local.json:ro

  projmng:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-projmng:${TAG:-latest}
    environment:
      <<: *common-env
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/ProjMngServer/appsettings.Local.json:/app/appsettings.Local.json:ro

  ai:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-ai:${TAG:-latest}
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - /srv/jsini/config/AIAgentServer/appsettings.Local.json:/app/appsettings.Local.json:ro

  # ── 프론트 (.NET 10 Blazor) ──────────────────────────────────────
  #
  # 2026-09-13 이전에는 이 둘이 컨테이너가 아니었다. nginx 가 /srv/jsini/portal
  # (vben 이 만든 정적 파일)과 /srv/jsini/site (vite-ssg) 를 직접 서빙했고,
  # 그래서 **프론트만 자동 배포에서 빠져 있었다.** 지금은 백엔드와 같은 길로
  # 간다 — GHCR 이미지 · 같은 TAG · 같은 compose.

  portal:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-portal:${TAG:-latest}
    ports:
      - "127.0.0.1:5557:8080"
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://0.0.0.0:8080

      # 컨테이너망 안에서 부른다. 호스트 루프백(127.0.0.1:5265)은 컨테이너
      # 안에서 자기 자신을 가리키므로 쓸 수 없다.
      Gateway__BaseUrl: http://gateway:8080/api/

      # **인증 쿠키를 푸는 키다.** 볼륨에 두지 않으면 배포마다(=컨테이너가
      # 새로 뜰 때마다) 키가 새로 생겨 전원 로그아웃된다.
      # 기본값(appsettings.json 의 ../../../.keys)은 개발 장비 기준이라
      # 컨테이너에서는 /.keys 로 풀리고 이미지와 함께 사라진다.
      DataProtection__KeyRingPath: /data/keys

      # 회로가 nginx 뒤에 있다. 프록시가 넘겨준 X-Forwarded-Proto 를 믿어야
      # https 로 판정한다 — 그래야 Secure 쿠키와 리다이렉트 주소가 맞는다.
      #
      # 이 환경변수는 ForwardedHeaders 미들웨어를 파이프라인 맨 앞에 꽂으면서
      # **신뢰 대역 제한(KnownNetworks·KnownProxies)을 비운다.** 기본값은
      # 루프백뿐인데 도커에서는 프록시가 브리지 게이트웨이 주소로 보여
      # 그 제한에 걸린다.
      #
      # 대역을 비워도 되는 이유는 이 컨테이너가 **127.0.0.1 로만 공개**되기
      # 때문이다. 바깥에서 직접 닿을 수 없으니 헤더를 위조해 넣을 자리가 없다.
      # 포트를 0.0.0.0 으로 여는 순간 이 전제가 깨진다.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - portal-keys:/data/keys
    depends_on: [gateway]

  web:
    <<: *common
    image: ghcr.io/quristyle/funeralv2-web:${TAG:-latest}
    ports:
      - "127.0.0.1:5556:8080"
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Gateway__BaseUrl: http://gateway:8080/api/

      # **브라우저가 직접 여는 주소의 밑동**이다. 표지 이미지와 자료
      # 내려받기가 마크업에 절대 주소로 박혀 나가므로, 위 BaseUrl(컨테이너
      # 이름)을 그대로 쓰면 브라우저에서 열리지 않는다.
      #
      # **오리진만 적는다 — 뒤에 /api 를 붙이지 않는다.** 붙는 값이 이미
      # `/api/file/...` 로 시작하고(SiteApi.PublicUrl), 비워 두었을 때의
      # 기본값도 BaseUrl 의 오리진이다. /api 를 적으면 /api/api/... 가 된다.
      Gateway__PublicBaseUrl: https://jsini.co.kr
    depends_on: [gateway]

volumes:
  # 포털 인증 쿠키의 Data Protection 키 링. 위 설명 참조 —
  # **이 볼륨을 지우면 전원 로그아웃된다.**
  portal-keys:
